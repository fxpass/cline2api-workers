name = "cline2api"
main = "worker.js"
compatibility_date = "2026-01-01"

# 关键：部署时保留 Cloudflare 面板上已设置的普通文本环境变量（否则 wrangler deploy
# 会按本地配置覆盖远端，面板里设置的 CLINE_REFRESH_TOKEN / API_KEY 等会被清掉）。
# Secret 类型不受影响，但加上此项后普通变量也能安全保留。
keep_vars = true

# 部署后输出 https://cline2api.<你的子域>.workers.dev
# 注意：CLINE_REFRESH_TOKEN 必须用 wrangler secret 设置，不要写在这里！
